plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.liquidos.tv')
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '0.9.4 Beta'
    }

    // Public releases: `./gradlew assembleRelease -PreleaseSigning` signs with the release key described in
    // ~/.android/liquidtv-release.properties (storeFile, storePassword, keyAlias, keyPassword), or in the file named by
    // -PreleaseKeyProperties. The key never goes in the repository. Without the flag, builds are signed with the
    // debug key as before, so a local build still installs over the one already on your TV.
    signingConfigs {
        if (project.hasProperty('releaseSigning')) {
            release {
                def props = new Properties()
                def file = new File(providers.gradleProperty('releaseKeyProperties')
                        .getOrElse(System.getProperty('user.home') + '/.android/liquidtv-release.properties'))
                if (!file.exists()) throw new GradleException('Release signing: ' + file + ' not found')
                file.withInputStream { props.load(it) }
                storeFile new File(props.getProperty('storeFile'))
                storePassword props.getProperty('storePassword')
                keyAlias props.getProperty('keyAlias')
                keyPassword props.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Debug key by default (installs over a local debug build); the release key with -PreleaseSigning.
            signingConfig project.hasProperty('releaseSigning') ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
